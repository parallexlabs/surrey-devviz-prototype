name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 -m pip install 'shapely>=2.0,<3'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run build:site
      - name: Check the site build
        run: |
          test -f dist-site/index.html
          test -f dist-site/data/development_projects.geojson
          test -f dist-site/data/skytrain.geojson
          test -f dist-site/data/amenities.geojson
          test -f dist-site/data/SOURCES.json
          test -f dist-site/data/README.md
          grep -q 'OpenStreetMap contributors' dist-site/data/README.md
          grep -q 'opendatacommons.org/licenses/odbl' dist-site/data/README.md
          grep -q 'Open Government License' dist-site/data/README.md
          ! grep -q '"height_m"' dist-site/data/development_projects.geojson
          ! grep -q '"height_source"' dist-site/data/development_projects.geojson
          ! grep -q '"storeys"' dist-site/data/development_projects.geojson
          ! grep -q '"height_label"' dist-site/data/development_projects.geojson
